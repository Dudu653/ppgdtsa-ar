<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabuleiros A4 — Organização do Sistema agroindustrial</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #e2e8f0;
      color: #1e293b;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
       gap: 24px;
      min-height: 100vh;
    }

    /* Barra de ferramentas na tela (oculta na impressão) */
    .toolbar {
      width: 100%;
      max-width: 1122px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }

    .toolbar-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .toolbar-title h1 {
      font-size: 1.02rem;
      font-weight: 800;
      color: #0f172a;
    }

    .toolbar-title p {
      font-size: 0.78rem;
      color: #64748b;
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .btn {
      padding: 8px 13px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn:hover {
      background: #f8fafc;
    }

    .btn.active-scenario {
      background: #0f172a;
      border-color: #0f172a;
      color: #ffffff;
    }

    .btn-primary {
      background: #065f46;
      border-color: #065f46;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #047857;
    }

    .boards-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* Folha A4 Paisagem (297mm x 210mm) */
    .board-sheet {
      width: 297mm;
      height: 210mm;
      background: #faf5e6;
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18);
      overflow: hidden;
      position: relative;
    }

    .board-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Permite ocultar ou exibir as guias pontilhadas */
    .hide-guides .placement-guides {
      display: none;
    }

    .hidden-sheet {
      display: none !important;
    }

    @page {
      size: A4 landscape;
      margin: 0;
    }

    @media print {
      body {
        background: #ffffff;
        padding: 0;
        margin: 0;
        gap: 0;
      }

      .toolbar {
        display: none !important;
      }

      .boards-wrapper {
        gap: 0;
      }

      .board-sheet {
        width: 297mm;
        height: 210mm;
        border-radius: 0;
        box-shadow: none;
        page-break-after: always;
        break-after: page;
      }

      .board-sheet:last-of-type {
        page-break-after: avoid;
        break-after: avoid;
      }
    }
  </style>
</head>
<body>

      <h1>🗺️ Tabuleiros Cenário A4 — Organização do Sistema agroindustrial</h1>
      <p>Dois cenários topográficos distintos no mesmo estilo visual (calibrados para leitura ArUco sem interferência).</p>

    <div class="toolbar-actions">

      <a href="./cards.html" class="btn">🃏 Mini-Cartas</a>

      <button id="btnPrintBoard" class="btn btn-primary">🖨️ Imprimir A4</button>

  <script>
    const btnScen1 = document.getElementById('btnScen1');
    const btnScen2 = document.getElementById('btnScen2');
    const btnScenBoth = document.getElementById('btnScenBoth');
    const sheet1 = document.getElementById('sheetScenario1');
    const sheet2 = document.getElementById('sheetScenario2');

    function setScenarioMode(mode) {
      btnScen1.classList.toggle('active-scenario', mode === '1');
      btnScen2.classList.toggle('active-scenario', mode === '2');
      btnScenBoth.classList.toggle('active-scenario', mode === 'both');

      sheet1.classList.toggle('hidden-sheet', mode === '2');
      sheet2.classList.toggle('hidden-sheet', mode === '1');
    }

    btnScen1.addEventListener('click', () => setScenarioMode('1'));
    btnScen2.addEventListener('click', () => setScenarioMode('2'));
    btnScenBoth.addEventListener('click', () => setScenarioMode('both'));

    const btnToggle = document.getElementById('btnToggleGuides');
    const wrapper = document.getElementById('boardsWrapper');
    let guidesVisible = false;

    btnToggle.addEventListener('click', () => {
      guidesVisible = !guidesVisible;
      wrapper.classList.toggle('hide-guides', !guidesVisible);
      btnToggle.textContent = guidesVisible ? '🎯 Guias: Ativadas' : '🎯 Guias: Ocultas';
    });

    document.getElementById('btnPrintBoard').addEventListener('click', () => {
      window.print();
    });

    // Remove o fundo branco de ambos os logos PPGDTSA para pousarem direto sobre o mapa
    const rawImg = new Image();
    rawImg.src = './src/assets/ppgdtsa_logo.png';
    rawImg.onload = () => {
      const c = document.createElement('canvas');
      c.width = rawImg.width;
      c.height = rawImg.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(rawImg, 0, 0);
      const imgData = ctx.getImageData(0, 0, c.width, c.height);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i];
        const g = d[i + 1];
        const b = d[i + 2];
        const minC = Math.min(r, g, b);
        if (minC > 245) {
          d[i + 3] = 0;
        } else if (minC > 228 && Math.max(r, g, b) - minC < 12) {
          d[i + 3] = Math.round(((245 - minC) / 17) * d[i + 3]);
        }
      }
      ctx.putImageData(imgData, 0, 0);
      const cleanDataUrl = c.toDataURL('image/png');
      document.querySelectorAll('.ppgdtsa-board-logo').forEach(el => {
        el.setAttribute('href', cleanDataUrl);
      });
    };
  </script>
